name: Checks

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # Build first so Python tests also exercise the served production assets.
      - run: python -m pytest -q
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/seiscanvas-matplotlib
          SEISCANVAS_STATE_DIR: ${{ runner.temp }}/seiscanvas-state
